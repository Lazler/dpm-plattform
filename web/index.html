<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPM Explorer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button class="brand" id="brand" title="Startseite"><span class="logo">▦</span> DPM Explorer <span class="rel" id="rel"></span></button>
  <nav class="views" id="views" role="tablist">
    <button data-view="start">Start</button>
    <button data-view="sheet">Meldebögen</button>
    <button data-view="lineage">Lineage</button>
    <button data-view="dp">Datenpunkte</button>
    <button data-view="hier">Hierarchien</button>
    <button data-view="model">DPM-Struktur</button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Suchen: Bogen, Zeile/Spalte, Regel, „F 01.01 r0110 c0010“ …  ( / )" autocomplete="off" aria-label="Globale Suche">
    <div class="results" id="results" hidden></div>
  </div>
</header>

<main>
  <!-- ===================== Start ===================== -->
  <section id="view-start" class="view"><div class="start" id="start"></div></section>

  <!-- ===================== Meldebogen-Ansicht ===================== -->
  <section id="view-sheet" class="view">
    <aside class="toc" id="toc">
      <div class="modsel" id="modsel"></div>
      <div class="tocsearch"><input id="tocfilter" type="search" placeholder="Bogen filtern …" aria-label="Meldebögen filtern"></div>
      <label class="chk tocopt" id="cmponlywrap" hidden><input type="checkbox" id="cmponly"> nur geänderte Bögen</label>
      <div class="toclist" id="toclist"></div>
    </aside>

    <div class="book">
      <div class="ribbon" id="ribbon">
        <button class="rb icon" id="toctoggle" title="Inhaltsverzeichnis ein-/ausblenden">☰</button>
        <div class="rgrp">
          <span class="rl">Regeln</span>
          <div class="seg sm" id="layer">
            <button data-l="off">Aus</button><button data-l="marker">Fehler-Marker</button><button data-l="heat">Heatmap</button>
          </div>
        </div>
        <div class="rgrp">
          <span class="rl" title="Änderungen seit einem früheren Release hervorheben">Vergleich seit</span>
          <select id="cmpsel" aria-label="Release-Vergleich"><option value="">–</option></select>
        </div>
        <div class="rgrp grow">
          <input id="find" type="search" placeholder="Im Bogen suchen …  (Strg+F)" aria-label="Im Bogen suchen">
          <span class="findinfo" id="findinfo"></span>
        </div>
        <button class="rb icon" id="copyref" title="Zellbezug kopieren (Strg+C)" aria-label="Zellbezug kopieren">⧉</button>
        <button class="rb icon" id="export" title="Bogen mit Datenpunkten und Regeln als CSV für Excel exportieren" aria-label="Als CSV exportieren">⤓</button>
      </div>
      <div class="formulabar">
        <div class="namebox" id="namebox">–</div>
        <div class="fx">fx</div>
        <div class="fxval" id="fxval">Zelle anklicken oder mit den Pfeiltasten wählen</div>
      </div>
      <div class="cmpbar" id="cmpbar" hidden></div>
      <div class="zbar" id="zbar" hidden></div>
      <div class="gridwrap" id="gridwrap" tabindex="0" aria-label="Meldebogen"><div class="empty">Meldebogen wählen …</div></div>
      <div class="bottombar">
        <div class="tabs" id="tabs"></div>
        <div class="status" id="status"></div>
        <div class="zoom"><button id="zminus" title="Verkleinern">−</button><span id="zval">100 %</span><button id="zplus" title="Vergrößern">+</button></div>
      </div>
    </div>

    <aside class="details" id="details" hidden>
      <div class="dhead">
        <div id="dtitle"></div>
        <button class="x" id="dclose" title="Schließen (Esc)">✕</button>
      </div>
      <div class="dtabs" id="dtabs"></div>
      <div class="dbody" id="dbody"></div>
    </aside>
  </section>

  <!-- ===================== Lineage ===================== -->
  <section id="view-lineage" class="view">
    <div class="lin-tools">
      <div class="seg" id="linmode">
        <button data-m="focus">Bogen im Fokus</button>
        <button data-m="tables">Gesamtnetz</button>
        <button data-m="cell">Zell-Lineage</button>
      </div>
      <select id="linfocus" aria-label="Bogen im Fokus"></select>
      <div class="seg" id="linmod"></div>
      <label class="chk" id="linextwrap"><input type="checkbox" id="linext"> andere Module zeigen</label>
      <label class="chk" id="lindepthwrap" hidden><input type="checkbox" id="lindepth"> 2. Ebene</label>
      <span class="hint" id="linhint"></span>
      <button class="rb" id="linfit" title="Ansicht einpassen">⤢ Einpassen</button>
    </div>
    <div class="lin-main">
      <div id="cy" class="cy"></div>
      <aside class="lin-side" id="linside"></aside>
    </div>
  </section>

  <!-- ===================== Datenpunkte ===================== -->
  <section id="view-dp" class="view">
    <aside class="dp-side">
      <h3>Datenpunkt-Suche</h3>
      <div class="sub">Datenpunkte nach Kennzahl und Merkmalen finden – über alle Meldebögen hinweg.</div>
      <input id="dptext" type="search" placeholder="Freitext, z. B. Households, Stage 2 …">
      <div class="seg" id="dpmod"></div>
      <div id="dpactive"></div>
      <div id="dpfacets"></div>
    </aside>
    <div class="dp-main" id="dpmain"></div>
  </section>

  <!-- ===================== Hierarchien ===================== -->
  <section id="view-hier" class="view">
    <aside class="hi-cats">
      <input id="hifilter" type="search" placeholder="Dimension oder Wert filtern …">
      <div id="hicats"></div>
    </aside>
    <aside class="hi-subs" id="hisubs"></aside>
    <div class="hi-main" id="himain"></div>
  </section>

  <!-- ===================== DPM-Struktur ===================== -->
  <section id="view-model" class="view">
    <div class="model-main">
      <div class="model-left">
        <div class="model-intro" id="modelintro"></div>
        <div id="cym" class="cy"></div>
      </div>
      <aside class="model-side" id="modelside"></aside>
    </div>
  </section>
</main>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/cytoscape.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
