name: Demo – GitHub Pages

# Optional: veröffentlicht den Explorer als GitHub-Pages-Seite (nur manuell startbar).
# Hinweise: Pages-Seiten sind öffentlich. Bei privaten Repositories braucht Pages einen kostenpflichtigen
# GitHub-Plan. Vorher unter Settings → Pages als Quelle "GitHub Actions" wählen.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Daten erzeugen
        run: |
          pip install -r requirements.txt
          python scripts/build_data.py --raw data/raw/4.4 --out web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
