name: Deploy – Azure Static Web Apps

# Baut die Daten aus data/raw und veröffentlicht web/ als Azure Static Web App.
# Voraussetzung: Repository-Secret AZURE_STATIC_WEB_APPS_API_TOKEN (Deployment-Token der Static Web App).
# Ohne Secret wird der Lauf mit einem Hinweis übersprungen.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Hinweis ohne Azure-Token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Kein AZURE_STATIC_WEB_APPS_API_TOKEN hinterlegt – Deployment übersprungen."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Daten erzeugen
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install -r requirements.txt
          python scripts/build_data.py --raw data/raw/4.4 --out web/data

      - name: Veröffentlichen
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true
